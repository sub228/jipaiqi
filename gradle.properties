# Project-wide Gradle settings
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false
org.gradle.daemon=false

# Kotlin
kotlin.code.style=official

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Disable build features we don't use to speed up builds
android.defaults.buildfeatures.buildconfig=true
android.suppressUnsupportedCompileSdk=34

# ---- Proxy: required so Gradle can reach Google Maven / Maven Central ----
# Gradle does NOT read HTTP_PROXY/HTTPS_PROXY env vars automatically; these
# system properties make it route through the sandbox egress proxy.
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=18080
systemProp.http.nonProxyHosts=localhost|127.0.0.1|*.cluster.local|*.svc
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=18080
systemProp.https.nonProxyHosts=localhost|127.0.0.1|*.cluster.local|*.svc

